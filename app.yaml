# DigitalOcean App Platform spec — Universal AI Copilot
#
# Instance size is apps-s-1vcpu-0.5gb, DigitalOcean's FREE App Platform tier.
# The legacy alias "basic-xxs" still resolves to the same free plan but is marked
# deprecated in the API spec, so the current slug is used here.
#
# Deploy options:
#   A) One command (no doctl needed, uses the DO REST API):
#        npm run deploy:do            # interactive, hidden key prompts
#      or, with doctl installed:
#        doctl apps create --spec app.yaml
#   B) Web UI (no token needed):  App Platform -> Create App -> import the public
#      GitHub repo -> choose "Dockerfile" -> set HTTP port 8080 and the env vars
#      below -> Deploy
#
# Full runbook: docs/deploy-digitalocean.md
name: universal-ai-copilot
region: blr
services:
    - name: web
      dockerfile_path: Dockerfile
      source_dir: /
      github:
          repo: surajns0033-collab/universal-ai-copilot
          branch: main
          deploy_on_push: true
      http_port: 8080
      instance_count: 1
      instance_size_slug: apps-s-1vcpu-0.5gb
      health_check:
          http_path: /api/analyze
      envs:
          # Set this in the DO UI (mark it as a SECRET). Never commit a real key.
          - key: GEMINI_API_KEY
            scope: RUN_TIME
            type: SECRET
            value: REPLACE_WITH_YOUR_GEMINI_KEY
          - key: GEMMA_MODEL
            scope: RUN_TIME
            value: gemma-4-26b-a4b-it
          - key: MAX_UPLOAD_MB
            scope: RUN_TIME
            value: '15'
          - key: AI_REQUEST_TIMEOUT_MS
            scope: RUN_TIME
            value: '45000'
